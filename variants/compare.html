<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare home page options</title>
<style>
  :root { --bg: #f4f5f7; --fg: #111827; --soft: #5b6475; --line: #dfe3ea; --on: #111827; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  .bar h1 { font-size: 15px; margin: 0 8px 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px 7px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .tabs button[aria-pressed="true"] { background: var(--on); color: #fff; border-color: var(--on); }
  .sw { display: inline-flex; border-radius: 999px; overflow: hidden; box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }
  .sw i { width: 12px; height: 18px; display: block; }
  .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .tools button, .tools a { font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; color: inherit; text-decoration: none; }
  .tools button[aria-pressed="true"] { background: var(--on); color: #fff; }
  .desc { width: 100%; font-size: 14px; color: var(--soft); margin: 0; }
  .stage { display: grid; place-items: center; overflow: auto; padding: 16px; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .25); transition: width .4s; }
  .phone iframe { width: 390px; height: 844px; max-height: 100%; }
</style>
</head>

    <a id="full" href="#" target="_blank">Open full ↗</a>
  </div>
  <p class="desc" id="desc"></p>
</div>
<div class="stage" id="stage"><iframe id="frame" title="Home page option"></iframe></div>

const tabs = document.getElementById("tabs"), frame = document.getElementById("frame"), desc = document.getElementById("desc"), full = document.getElementById("full");
function show(i) {
  frame.src = options[i].file; desc.textContent = options[i].desc; full.href = options[i].file;
  [...tabs.children].forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
}
options.forEach((o, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="sw">${o.colors.map(c => `<i style="background:${c}"></i>`).join("")}</span>${o.name}`;
  b.onclick = () => show(i); tabs.appendChild(b);
});
document.getElementById("mobile").onclick = (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on));
  document.getElementById("stage").classList.toggle("phone", on);
};
